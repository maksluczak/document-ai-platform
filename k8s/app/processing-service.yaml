apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: document-ai-platform-processing-service:latest
          imagePullPolicy: Never
          env:
            - name: RabbitMqConnection__Host
              value: rabbitmq
            - name: RabbitMqConnection__Username
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_USER
            - name: RabbitMqConnection__Password
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: RABBITMQ_PASSWORD
            - name: MinIOConnection__ServiceUrl
              value: http://minio:9000
            - name: MinIOConnection__Username
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MINIO_ROOT_USER
            - name: MinIOConnection__Password
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: Classifier__BaseUrl
              value: http://classifier:8000
            - name: AzureAi__Endpoint
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AZURE_AI_ENDPOINT
            - name: AzureAi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AZURE_AI_KEY