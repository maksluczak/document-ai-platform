kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: docai
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ./server/ML/classifier-service/model
        containerPath: /models/document-classifier
        readOnly: true
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000